# ==========================================
# Kubernetes Services: Project 75 Task Manager (MERN Stack)
# Deliverable: service.yaml
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  labels:
    app: mongodb
    tier: database
spec:
  type: ClusterIP
  selector:
    app: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: taskmanager-service
  labels:
    app: taskmanager
    tier: frontend-backend
spec:
  type: NodePort
  selector:
    app: taskmanager
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30081
