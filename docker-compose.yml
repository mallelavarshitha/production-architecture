name: production-architecture

services:
  # ==========================================
  # 1. MongoDB Database Service
  # ==========================================
  mongodb:
    container_name: p75-mongodb
    image: mongo:7.0
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-adminSecretPassword123!}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-taskdb}
      MONGO_USER: ${MONGO_USER:-appuser}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-appSecurePassword123!}
    volumes:
      - p75_mongodb_data:/data/db
      - ./mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - p75_network
    deploy:
      resources:
        limits:
          memory: 300M
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  # ==========================================
  # 2. Node.js & Express API Backend Service
  # ==========================================
  backend:
    container_name: p75-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-production}
      MONGO_URI: ${MONGO_URI:-mongodb://${MONGO_USER:-appuser}:${MONGO_PASSWORD:-appSecurePassword123!}@mongodb:27017/${MONGO_DATABASE:-taskdb}?authSource=${MONGO_DATABASE:-taskdb}}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - p75_network
    deploy:
      resources:
        limits:
          memory: 200M
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

  # ==========================================
  # 3. React Frontend Service
  # ==========================================
  frontend:
    container_name: p75-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - p75_network
    deploy:
      resources:
        limits:
          memory: 80M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # 4. Nginx Reverse Proxy Service
  # ==========================================
  nginx:
    container_name: p75-nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - p75_network
    deploy:
      resources:
        limits:
          memory: 80M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/nginx-health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s

# ==========================================
# Dedicated, Isolated Networks and Volumes
# Zero overlap with Project 20
# ==========================================
networks:
  p75_network:
    name: p75_network
    driver: bridge

volumes:
  p75_mongodb_data:
    name: p75_mongodb_data
